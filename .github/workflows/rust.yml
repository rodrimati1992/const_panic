name: Rust

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 2
      matrix:
        rust: [stable, beta, nightly, 1.88.0, 1.82.0, 1.64.0, 1.57.0]

    steps:
    - uses: actions/checkout@v2
    - name: ci-1-88-version-env_vars
      if: ${{ matrix.rust == '1.88.0' }}
      run: echo "rustv=rust_1_88" >> $GITHUB_ENV

    - uses: actions/checkout@v2
    - name: ci-1-82-version-env_vars
      if: ${{ matrix.rust == '1.82.0' }}
      run: echo "rustv=rust_1_82" >> $GITHUB_ENV

    - uses: actions/checkout@v2
    - name: ci-1-64-version-env_vars
      if: ${{ matrix.rust == '1.64.0' }}
      run: echo "rustv=rust_1_64" >> $GITHUB_ENV

    - uses: actions/checkout@v2
    - name: ci-stable-or-later-env_vars
      if: ${{ matrix.rust == 'stable' || matrix.rust == 'beta' || matrix.rust == 'nightly' }}
      run: echo "rustv=rust_latest_stable" >> $GITHUB_ENV

    - uses: actions/checkout@v2
    - name: ci-all-versions
      run: |
        rustup override set ${{ matrix.rust }}
        cargo update
          
        cargo build --no-default-features
        cargo build

        cargo doc --features="test ${{env.rustv}}"

        cargo test --features "test"
        cargo test --no-default-features --features "test ${{env.rustv}}"
        cargo test --no-default-features --features "test ${{env.rustv}} non_basic"

    - name: env-var-to-set-panic-length-limit-0
      run: cargo test --features "${{env.rustv}}" --test max_length_env_var_test -- --nocapture
      env: 
        CONST_PANIC_MAX_LENGTH: 0

    - name: env-var-to-set-panic-length-limit-3
      run: cargo test --features "${{env.rustv}}" --test max_length_env_var_test -- --nocapture
      env: 
        CONST_PANIC_MAX_LENGTH: 3

    - name: env-var-to-set-panic-length-limit-10
      run: cargo test --features "${{env.rustv}}" --test max_length_env_var_test -- --nocapture
      env: 
        CONST_PANIC_MAX_LENGTH: 10

    - name: env-var-to-set-panic-length-limit-80000
      run: cargo test --features "${{env.rustv}}" --test max_length_env_var_test -- --nocapture
      env: 
        CONST_PANIC_MAX_LENGTH: 80000

    - name: env-var-to-set-panic-length-limit-_
      run: cargo test --features "${{env.rustv}}" --test max_length_env_var_test -- --nocapture
      env: 
        CONST_PANIC_MAX_LENGTH: '_'

    - uses: actions/checkout@v2
    - name: ci-proc-macros
      if: ${{ matrix.rust != '1.64.0' && matrix.rust != '1.57.0' }}
      run: |
        rustup override set ${{ matrix.rust }}
        cargo update

        cd "${{github.workspace}}/const_panic_proc_macros/"
        cargo test

        cd "${{github.workspace}}/"
        cargo doc --features="test ${{env.rustv}} derive"

        cargo test --no-default-features --features "test ${{env.rustv}} non_basic derive"

    - uses: actions/checkout@v2
    - name: ci-nightly
      if: ${{ matrix.rust == 'nightly' }}
      run: |
        rustup override set ${{ matrix.rust }}
        cargo update

        rustup component add rust-src
        rustup component add miri

        # makes sure that this crate builds on at least this 16-bit architecture
        cargo build -Zbuild-std=core --target=msp430-none-elf \
          --features "test rust_latest_stable non_basic"


        # testing passing env var to limit panic message length
        
        cargo miri test --config="env.CONST_PANIC_MAX_LENGTH=\"0\"" \
          --features "rust_latest_stable non_basic"\
          --test max_length_env_var_test 

        cargo miri test --config="env.CONST_PANIC_MAX_LENGTH=\"3\"" \
          --features "rust_latest_stable non_basic"\
          --test max_length_env_var_test 

        cargo miri test --config="env.CONST_PANIC_MAX_LENGTH=\"10\"" \
          --features "rust_latest_stable non_basic"\
          --test max_length_env_var_test

        # a bit too expensive to run
        # cargo miri test --config="env.CONST_PANIC_MAX_LENGTH=\"80000\"" \
        #   --features "rust_latest_stable non_basic"\
        #   --test max_length_env_var_test 

        cargo miri test --config="env.CONST_PANIC_MAX_LENGTH=\"_\"" \
          --features "rust_latest_stable non_basic"\
          --test max_length_env_var_test 


